name: CI
on: [push, pull_request]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Download Dependencies
              run: npm ci
            - name: Run tests
              run: npm test
    lint:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Download Dependencies
              run: npm ci
            - name: Run linter
              run: npm run lint